<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seer app | Market explorer</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script>try{if(localStorage.getItem('seer-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/shell.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/motion.css">
<script src="js/spring.js" defer blocking="render"></script><script src="js/motion.js" defer blocking="render"></script><script src="js/shell.js" defer blocking="render"></script><script src="js/util.js" defer blocking="render"></script><script src="js/markets.js" defer blocking="render"></script><script src="js/app.js" defer blocking="render"></script></head>
<body>
<div id="shell"></div>
<main id="main">
 <header class="phead"><div class="phead-in">
  <div><p class="kicker"><span class="tag num">01</span>The explorer</p><h1>Every market on Seer</h1>
  <p class="lede">Categorical, multi-categorical, scalar, multi-scalar and conditional markets in one explorer.</p>
  <p class="phead-act"><button class="btn act" id="create" type="button">Create market</button></p></div>
  <div class="phead-aside"><span class="badge ghost">Illustrative data</span></div>
 </div></header>
 <div class="wrap">
  <section class="kpi top" id="stats" aria-label="Summary"></section>
  <div class="filters">
  <div class="tabs" id="cats" role="group" aria-label="Category"></div>
  <div class="toolbar">
    <input class="field search" id="q" type="search" placeholder="Search markets or outcomes" aria-label="Search markets">
    <select class="field cat-m" id="cat-m" aria-label="Category"></select>
    <select class="field" id="status" aria-label="Status"><option value="">All statuses</option><option>Open</option><option>Live</option><option>Closed</option><option>Resolved</option></select>
    <select class="field" id="sort" aria-label="Sort by"><option value="vol">Sort: volume</option><option value="liq">Sort: liquidity</option><option value="name">Sort: title, A to Z</option></select>
    <div class="seg" role="group" aria-label="View"><button id="vg" type="button" aria-pressed="true">Grid</button><button id="vt" type="button" aria-pressed="false">Table</button></div>
  </div>
  <div class="chips" id="types" role="group" aria-label="Market type"></div>
  </div>
  <p class="results-line" id="count" aria-live="polite"></p>
  <div id="out"></div>
 </div>
</main>
<div id="panel-root"></div>
</body></html>
